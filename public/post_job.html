<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post a Job — 9 to 5</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="siteHeader" class="site-header"><a class="brand" href="/"><img src="/assets/logo.svg" alt="" width="32" height="32"><span>9 to 5</span></a></header>
  <main class="container auth-wrap wide">
    <h1 class="page-title" id="formTitle">Post a Job</h1>
    <p class="page-sub">Labourers in your area will see it and apply.</p>
    <form id="postJobForm" class="card form-card">
      <div class="form-grid">
        <label class="full">Job title <input name="title" required minlength="3" placeholder="e.g. Fix bathroom leak"></label>
        <label>Trade needed <select name="trade" required id="tradeSelect"></select></label>
        <label>Location <select name="location" required id="areaSelect"><option value="">Loading locations…</option></select></label>
        <label class="full">Full address <input name="address" required minlength="5" maxlength="255" placeholder="Flat / building, street, area, pincode">
          <small class="muted">Only shared with the labourer you hire, as a map pin.</small></label>
        <label>Budget (₹) <input name="budget" type="number" min="100" required></label>
        <fieldset class="full field-group" id="slotBox"><legend>When is the work? <span class="muted">A labourer can only take one job at a time.</span></legend></fieldset>
        <label class="full">Details <textarea name="details" rows="4" placeholder="Describe the work, tools needed, timing…"></textarea></label>
      </div>
      <div class="form-error"></div>
      <div class="form-actions">
        <button class="btn" type="submit">Post Job</button>
        <a href="/dashboard" class="btn ghost">Cancel</a>
      </div>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/post_job.js"></script>
</body>
</html>
