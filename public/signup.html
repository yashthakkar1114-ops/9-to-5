<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — 9 to 5</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="siteHeader" class="site-header"><a class="brand" href="/"><img src="/assets/logo.svg" alt="" width="32" height="32"><span>9 to 5</span></a></header>
  <main class="container auth-wrap wide">
    <h1 class="page-title">Join 9 to 5</h1>
    <p class="page-sub">Choose how you want to use 9 to 5.</p>
    <div class="choice-grid">
      <a class="card choice" href="/signup-poster">
        <div class="icon">🏠</div>
        <h3>I need workers</h3>
        <p>Post jobs and hire plumbers, electricians, painters and more near you.</p>
      </a>
      <a class="card choice" href="/signup-labourer">
        <div class="icon">🛠️</div>
        <h3>I'm a labourer</h3>
        <p>Create your profile, find jobs nearby and get booked directly.</p>
      </a>
    </div>
    <p class="auth-foot">Already have an account? <a href="/login">Log in</a></p>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
