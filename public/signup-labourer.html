<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up as Labourer — 9 to 5</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="siteHeader" class="site-header"><a class="brand" href="/">9 to 5</a></header>
  <main class="container auth-wrap wide">
    <div class="card form-card">
      <h1>Create a Labourer account</h1>
      <p class="muted">Get found by people who need your skills.</p>
      <form id="signupForm" data-role="labourer" style="margin-top:16px">
        <div class="form-grid">
          <label class="full">Full name <input name="name" required minlength="2" autocomplete="name"></label>
          <label>Email <input name="email" type="email" required autocomplete="email"></label>
          <label>Phone number <input name="phone" type="tel" required pattern="\+?[0-9 \-]{10,15}" placeholder="10-digit mobile number" autocomplete="tel"></label>
          <label>Trade <select name="trade" required id="tradeSelect"></select></label>
          <label>Area you work in <input name="area" required placeholder="e.g. Andheri"></label>
          <label>Daily rate (₹) <input name="daily_rate" type="number" min="100" required placeholder="e.g. 600"></label>
          <label>Experience (years) <input name="experience" type="number" min="0" max="60" value="0"></label>
          <label class="full">Skills <input name="skills" placeholder="e.g. Leak repair, pipe fitting, bathroom fittings"></label>
          <label class="full">Password <input name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label>
        </div>
        <div class="form-error"></div>
        <button class="btn block" type="submit">Create account</button>
      </form>
    </div>
    <p class="auth-foot">Need to hire instead? <a href="/signup-poster">Sign up as Job Poster</a> · <a href="/login">Log in</a></p>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
