<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>9 to 5 — Hire Labourers</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">9 to 5</div>
    <nav role="navigation" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="post_job.html">Post Job</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="admin.html">Admin</a>
      <button id="authBtn" class="btn small" type="button">Login / Signup</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Find trusted labourers nearby — fast</h1>
      <p>Search skilled daily-wage workers — plumbing, carpentry, movers and more.</p>

      <div class="search-bar" role="search" aria-label="Search workers">
        <input id="searchQuery" name="searchQuery" placeholder="Search job or worker (e.g. plumber)" aria-label="Search query" />
        <label for="filterType" class="sr-only">Filter by type</label>
        <select id="filterType" name="filterType" aria-label="Filter by type">
          <option value="">All types</option>
          <option value="Plumber">Plumber</option>
          <option value="Carpenter">Carpenter</option>
          <option value="Electrician">Electrician</option>
          <option value="Mover">Mover</option>
          <option value="Painter">Painter</option>
        </select>
        <input id="filterLocation" name="filterLocation" placeholder="Location" aria-label="Location" />
        <button id="searchBtn" class="btn" type="button">Search</button>
      </div>
    </section>

    <section aria-labelledby="workers-heading">
      <h2 id="workers-heading">Available Workers</h2>
      <div id="workersGrid" class="grid" aria-live="polite"></div>
      <div id="noResults" class="muted" style="display:none">No workers found.</div>
    </section>

    <section aria-labelledby="jobs-heading">
      <h2 id="jobs-heading">Recent Job Posts</h2>
      <div id="jobsList" class="list" aria-live="polite"></div>
    </section>
  </main>

  <template id="workerCardTpl">
    <div class="card worker-card">
      <img class="worker-photo" src="assets/placeholder.png" alt="Worker photo">
      <div class="card-body">
        <h3 class="name"></h3>
        <div class="meta"></div>
        <p class="skills"></p>
        <div class="actions">
          <button class="btn small view-btn" type="button">View</button>
          <button class="btn small book-btn" type="button">Book</button>
        </div>
      </div>
    </div>
  </template>

  <noscript>
    <div class="card" style="margin:16px; padding:12px;">
      <strong>Note:</strong> This application requires JavaScript to run. Please enable JavaScript in your browser.
    </div>
  </noscript>

  <script src="js/app.js" defer></script>
</body>
</html>
